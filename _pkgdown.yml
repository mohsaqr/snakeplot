url: https://pak.dynasite.org/Snakeplot

template:
  bootstrap: 5

authors:
  Mohammed Saqr:
    href: https://saqr.me
  Sonsoles Lopez-Pernas:
    href: https://sonsoles.me

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

reference:
- title: Overview
  contents:
  - snakeplot-package

- title: Survey and experience sampling responses
  desc: One band per item, or one band per study day for beep-level ratings;
    responses as ticks, dots or stacked bars.
  contents:
  - survey_snake
  - survey_sequence
  - sequential_dist

- title: Sequences and timelines
  desc: Ordered categorical states, several sequences at once, and phases
    with start and end dates.
  contents:
  - sequence_snake
  - multi_snake
  - timeline_snake

- title: Daily activity
  desc: Time-stamped events and continuous signals on a daily clock, one band
    per day.
  contents:
  - activity_snake
  - line_snake

- title: Panels
  desc: One serpentine plot per group.
  contents:
  - facet_snake

- title: Results
  desc: The tables of a drawn plot's layout.
  contents:
  - as.data.frame.snake_layout

- title: Palettes
  desc: Diverging and sequential colors, interpolated to the number of
    levels.
  contents:
  - snake_palette
  - snake_palettes

- title: Data
  desc: A 14-day experience sampling study of university students.
  contents:
  - ema_emotions
  - student_survey
  - ema_beeps

articles:
- title: Vignettes
  navbar: Vignettes
  contents:
  - snakeplot
  - survey-responses

- title: Guides
  navbar: Guides
  contents:
  - articles/sequences
  - articles/activity
  - articles/palettes-and-layout

- title: Case studies
  navbar: Case studies
  contents:
  - articles/case-daily-emotions
  - articles/case-student-survey
